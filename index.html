<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!-- Hace que la app se vea bien en móviles: ancho = ancho del dispositivo, sin zoom inicial -->
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Pokédex V1.0</title>
<style>
  /* Quita el margen/padding por defecto del navegador en html y body */
  @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}
  /* Oculta la barra de scroll visualmente (el scroll sigue funcionando) */
  ::-webkit-scrollbar{display:none;}
  /* Sombra interna que simula el "chasis" plástico de una Pokédex física */
  .pokedex-chassis{box-shadow:inset -4px -4px 0px 0px rgba(65,0,6,0.4),inset 4px 4px 0px 0px rgba(255,218,216,0.3);}
  /* Animación de escaneo (línea que baja) - actualmente definida pero no se usa en el DOM */
  @keyframes scan{0%{transform:translateY(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(100%);opacity:0;}}
  /* Animación de "flotar" que se le aplica a los sprites de las tarjetas del catálogo */
  @keyframes pokemon-float{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-8px) rotate(-1.5deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }
  /* Clase que se le pone a cada <img> de Pokémon para que "flote" en bucle infinito */
  .pokemon-sprite{animation:pokemon-float 3s ease-in-out infinite;}
  /* Al pasar el mouse por encima, la animación se pausa (efecto de interacción) */
  .pokemon-sprite:hover{animation-play-state:paused;}
</style>
<!-- Tailwind CSS vía CDN: permite usar clases de utilidad (bg-, flex, p-, etc.) sin instalar nada -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Configuración personalizada de Tailwind: define la paleta de colores, tipografías,
     tamaños de fuente y espaciados propios del diseño "Pokédex retro" -->
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{
"colors":{"on-primary-fixed":"#410006","inverse-primary":"#ffb3b0","surface-container-lowest":"#ffffff","on-secondary":"#ffffff","on-primary-container":"#ffeeed","primary-fixed-dim":"#ffb3b0","secondary-container":"#ff5c47","secondary-fixed-dim":"#ffb4a8","surface-dim":"#dcd9d9","surface-variant":"#e5e2e1","background":"#fcf9f8","tertiary":"#005e78","on-surface":"#1b1c1c","tertiary-fixed":"#bce9ff","error-container":"#ffdad6","primary-container":"#dc0a2d","outline":"#926e6c","on-tertiary-fixed-variant":"#004d64","on-error-container":"#93000a","primary-fixed":"#ffdad8","outline-variant":"#e7bcba","on-tertiary-fixed":"#001f2a","on-background":"#1b1c1c","surface":"#fcf9f8","error":"#ba1a1a","surface-bright":"#fcf9f8","on-secondary-container":"#610000","on-primary-fixed-variant":"#930019","primary":"#af0020","on-primary":"#ffffff","surface-tint":"#bf0024","secondary-fixed":"#ffdad4","surface-container-high":"#eae7e7","secondary":"#b52619","on-tertiary-container":"#e4f5ff","inverse-surface":"#303030","surface-container-highest":"#e5e2e1","on-secondary-fixed":"#410000","on-surface-variant":"#5d3f3e","tertiary-container":"#007899","tertiary-fixed-dim":"#7cd1f6","on-error":"#ffffff","on-tertiary":"#ffffff","surface-container":"#f0eded","surface-container-low":"#f6f3f2","inverse-on-surface":"#f3f0ef","on-secondary-fixed-variant":"#920703"},
"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
"spacing":{"bezel-thickness":"12px","gutter":"16px","base":"4px","margin-desktop":"40px","margin-mobile":"20px"},
"fontFamily":{"label-lcd":["JetBrains Mono"],"headline-lg":["Space Grotesk"],"label-data":["JetBrains Mono"],"body-md":["Hanken Grotesk"],"headline-lg-mobile":["Space Grotesk"]},
"fontSize":{"label-lcd":["12px",{"lineHeight":"1.0","fontWeight":"700"}],"headline-lg":["32px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"700"}],"label-data":["14px",{"lineHeight":"1.2","letterSpacing":"0.05em","fontWeight":"500"}],"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"1.2","fontWeight":"700"}]}
}}}
</script>
<!-- Fuente de íconos "Material Symbols" (se usa para lupa de búsqueda y flechas de paginación) -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<!-- Fuentes tipográficas del diseño: JetBrains Mono (estilo pantalla LCD), Space Grotesk (títulos), Hanken Grotesk (texto) -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet" />
</head>
<body class="bg-on-primary-fixed min-h-screen font-body-md text-on-surface overflow-x-hidden">

<!-- Contenedor principal: simula el "cuerpo" físico de la Pokédex (marco rojo con esquinas redondeadas) -->
<div class="fixed inset-margin-desktop bg-primary pokedex-chassis rounded-xl overflow-hidden flex flex-col z-0 shadow-2xl border-4 border-on-primary-fixed">

  <!-- ===================== HEADER ===================== -->
  <!-- Barra superior con el "ojo" decorativo, los 3 botones de color y el nombre de la app -->
  <header class="h-24 bg-primary flex items-center justify-between px-8 border-b-4 border-on-primary-fixed relative">
    <div class="flex items-center gap-4">
      <!-- Círculo decorativo tipo "lente/ojo" de la Pokédex clásica -->
      <div class="relative flex items-center justify-center">
        <div class="w-16 h-16 rounded-full bg-surface-container-lowest border-4 border-on-surface flex items-center justify-center overflow-hidden shadow-inner">
          <div class="w-12 h-12 rounded-full bg-tertiary-container border-2 border-on-tertiary-fixed-variant animate-pulse"></div>
        </div>
        <!-- Reflejo de luz falso sobre el "lente" -->
        <div class="absolute -top-1 -left-1 w-6 h-6 rounded-full bg-white/30"></div>
      </div>
      <!-- Los 3 botones circulares decorativos (rojo, naranja, azul) de la Pokédex clásica -->
      <div class="flex gap-2 ml-4">
        <div class="w-4 h-4 rounded-full bg-error border-2 border-on-primary-fixed shadow-md"></div>
        <div class="w-4 h-4 rounded-full bg-secondary-container border-2 border-on-primary-fixed shadow-md"></div>
        <div class="w-4 h-4 rounded-full bg-tertiary border-2 border-on-primary-fixed shadow-md"></div>
      </div>
      <!-- Nombre de la app -->
      <div class="ml-8 flex items-center gap-3">
        <span class="font-headline-lg text-headline-lg text-on-primary uppercase tracking-tighter">Pokédex</span>
      </div>
    </div>
    <!-- Navegación entre las dos vistas de la app: Catálogo y Reconocimiento -->
    <div class="flex items-center gap-6">
      <nav class="flex bg-on-primary-fixed/20 p-1 rounded-lg border-2 border-on-primary-fixed">
        <!-- data-view apunta al id de la vista que debe mostrarse al hacer clic (ver main.js) -->
        <button data-view="catalog-view" class="tab-btn px-6 py-2 font-label-data text-label-data transition-all rounded-md bg-on-primary-fixed text-primary-fixed-dim">CATÁLOGO</button>
        <button data-view="recognition-view" class="tab-btn px-6 py-2 font-label-data text-label-data text-on-primary hover:bg-on-primary-fixed/40 transition-all rounded-md">RECONOCIMIENTO</button>
      </nav>
    </div>
  </header>

  <!-- Cuerpo de la app: sidebar + vista activa -->
  <div class="flex-1 flex overflow-hidden p-bezel-thickness">

    <!-- ===================== SIDEBAR (compartido) ===================== -->
    <!-- Panel lateral visible en ambas vistas: estado del sistema y búsquedas recientes -->
    <aside class="w-72 bg-on-primary-fixed/10 flex flex-col gap-6 pr-gutter border-r-2 border-on-primary-fixed/20">
      <!-- Pantalla tipo LCD que muestra el estado actual (ONLINE // SCANNING, ERROR // API, etc.) -->
      <div class="bg-surface-container-highest p-base rounded-lg border-2 border-on-primary-fixed shadow-inner">
        <div class="bg-on-surface text-tertiary-fixed p-4 font-label-lcd text-label-lcd rounded flex flex-col gap-2">
          <span class="text-xs opacity-60">SYSTEM STATUS</span>
          <!-- main.js actualiza este texto según lo que esté pasando (cargando, error, listo) -->
          <span id="system-status" class="text-sm uppercase tracking-widest">ONLINE // SCANNING</span>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto pr-2">
        <div class="space-y-4">
          <!-- Lista de las últimas búsquedas exitosas (se llena dinámicamente desde main.js) -->
          <div class="p-4 bg-primary-container/20 border-2 border-primary-container rounded-lg">
            <span class="font-label-data text-label-data text-on-primary-container block mb-2">RECIENTES</span>
            <div id="recent-list" class="space-y-1 text-xs text-on-primary/80 font-label-data"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===================== VISTA: CATÁLOGO ===================== -->
    <!-- Vista visible por defecto: buscador + grilla de tarjetas + paginación -->
    <main id="catalog-view" class="view flex-1 bg-surface rounded-xl border-4 border-on-primary-fixed shadow-[inset_0_4px_12px_rgba(0,0,0,0.2)] overflow-y-auto relative p-gutter">
      <div class="flex flex-col w-full h-full relative font-body-md text-on-surface">

        <!-- Barra de búsqueda por nombre o número de Pokémon -->
        <div class="flex flex-col md:flex-row gap-gutter mb-gutter shrink-0">
          <div class="flex-1 bg-surface-container-highest p-base rounded-lg shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] relative overflow-hidden">
            <div class="absolute top-0 left-0 bottom-0 w-1 bg-primary/20"></div>
            <div class="flex items-center px-4 py-2 bg-on-surface text-tertiary-fixed font-label-lcd text-label-lcd rounded">
              <span class="material-symbols-outlined mr-2 text-[16px] opacity-70">search</span>
              <!-- main.js escucha el evento "input" de este campo para filtrar/buscar con debounce -->
              <input id="search-input" class="bg-transparent border-none outline-none w-full text-tertiary-fixed placeholder:text-tertiary-fixed/40 uppercase tracking-widest" placeholder="ENTER POKEMON NAME OR ID..." type="text" />
            </div>
          </div>
        </div>

        <!-- Indicador decorativo (barras) + contador de resultados encontrados -->
        <div class="flex justify-between items-end mb-4 px-2 shrink-0">
          <div class="flex gap-1">
            <div class="w-1 h-3 bg-secondary"></div>
            <div class="w-1 h-3 bg-secondary/60"></div>
            <div class="w-1 h-3 bg-secondary/30"></div>
          </div>
          <!-- main.js actualiza este número cada vez que cambia el catálogo o la búsqueda -->
          <span id="matches-found" class="font-label-lcd text-label-lcd text-on-surface/50 tracking-widest uppercase">MATCHES FOUND: 000</span>
        </div>

        <!-- Caja de mensajes de error de la PokéAPI: oculta por defecto, main.js la muestra si algo falla -->
        <div id="catalog-error" class="hidden mb-4 px-4 py-3 bg-error-container text-on-error-container font-label-data text-label-data rounded-lg"></div>

        <!-- Grilla donde se insertan las tarjetas (skeletons mientras carga, tarjetas reales después) -->
        <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter overflow-y-auto pb-margin-desktop px-2 flex-1 relative z-10"></div>

        <!-- Controles de paginación: anterior / número de página / siguiente -->
        <div class="flex items-center justify-center gap-4 pt-4 shrink-0">
          <button id="prev-page" class="w-9 h-9 rounded-full bg-surface-container-high hover:bg-surface-container-highest flex items-center justify-center font-label-data disabled:opacity-30">
            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          </button>
          <span id="page-indicator" class="font-label-lcd text-label-lcd text-on-surface/60">PÁG 01</span>
          <button id="next-page" class="w-9 h-9 rounded-full bg-surface-container-high hover:bg-surface-container-highest flex items-center justify-center font-label-data">
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>
        </div>
      </div>
    </main>

    <!-- ===================== VISTA: RECONOCIMIENTO ===================== -->
    <!-- Vista oculta por defecto (clase "hidden"): cámara + botón de escaneo + resultado -->
    <main id="recognition-view" class="view hidden flex-1 bg-surface rounded-xl border-4 border-on-primary-fixed shadow-[inset_0_4px_12px_rgba(0,0,0,0.2)] overflow-y-auto relative p-gutter">
      <div class="flex flex-col w-full h-full p-4 gap-4 bg-surface-container-lowest text-on-surface">
      <div class="flex flex-col md:flex-row gap-4 h-full min-h-0">

          <!-- Columna izquierda: feed de la cámara -->
          <div class="w-full md:w-[60%] flex flex-col gap-2 min-h-0">
            <!-- Barra superior de la "pantalla" de la cámara: LED de estado + etiqueta -->
            <div class="flex items-center justify-between px-4 py-2 bg-on-primary-fixed text-primary-fixed-dim rounded-t-lg border-2 border-b-0 border-on-primary-fixed">
              <div class="flex items-center gap-2">
                <!-- main.js cambia el color de este LED según el estado de la cámara -->
                <div id="camera-led" class="w-3 h-3 rounded-full bg-outline"></div>
                <span id="camera-status-label" class="font-label-lcd text-label-lcd tracking-widest">CÁMARA EN ESPERA</span>
              </div>
              <span class="font-label-lcd text-label-lcd opacity-50">SYS.VER.1.0</span>
            </div>

            <!-- Contenedor del video: define el área real donde se ve la cámara (usado también
                 por recognition.js para calcular qué región recortar y enviar al modelo) -->
            <div id="camera-frame-container" class="relative flex-1 bg-on-surface rounded-b-lg border-4 border-on-primary-fixed overflow-hidden shadow-[inset_0_4px_16px_rgba(0,0,0,0.8)] min-h-[320px] flex items-center justify-center">
              <!-- Elemento <video> real donde camera.js conecta el stream de getUserMedia -->
              <video id="camera-feed" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline muted></video>
              <!-- Mensaje que se muestra mientras la cámara no está activa -->
              <p id="camera-message" class="font-label-lcd text-label-lcd text-tertiary-fixed/70 text-center px-6">Presiona INICIAR CÁMARA para comenzar</p>

              <!-- Cuadro de enfoque (reticle): solo visible con la cámara activa.
                   Su tamaño (w-48 h-48 = 192px) debe coincidir con RETICLE_SIZE_PX en recognition.js -->
              <div id="focus-reticle" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-48 h-48 border-2 border-tertiary-fixed/30 relative">
                  <!-- Las 4 esquinas decorativas del cuadro de enfoque -->
                  <div class="absolute -top-1 -left-1 w-4 h-4 border-t-4 border-l-4 border-tertiary-fixed"></div>
                  <div class="absolute -top-1 -right-1 w-4 h-4 border-t-4 border-r-4 border-tertiary-fixed"></div>
                  <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-4 border-l-4 border-tertiary-fixed"></div>
                  <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-4 border-r-4 border-tertiary-fixed"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Columna derecha: botón de escaneo, estado y resultado del reconocimiento -->
          <div class="w-full md:w-[40%] flex flex-col gap-4 min-h-0">
            <!-- Panel con el botón físico de "SCAN" (inicia/detiene la cámara) -->
            <div class="shrink-0 bg-surface-container-high rounded-xl border-2 border-on-primary-fixed p-4 shadow-md flex flex-col items-center justify-center relative">
              <div class="absolute top-2 left-2 right-2 h-[2px] bg-on-primary-fixed/20 rounded-full"></div>
              <div class="absolute bottom-2 left-2 right-2 h-[2px] bg-on-primary-fixed/20 rounded-full"></div>
              <span id="scan-label" class="font-label-data text-label-data text-on-surface-variant mb-4 uppercase tracking-widest bg-surface-container-lowest px-4 py-1 rounded border border-on-primary-fixed/30 shadow-sm">INITIATE SCAN</span>

              <div class="relative group cursor-pointer">
                <div class="w-24 h-24 rounded-full bg-on-primary-fixed shadow-[inset_0_4px_8px_rgba(0,0,0,0.6)] flex items-center justify-center">
                  <!-- Botón real: main.js alterna entre iniciar y detener la cámara al hacer clic -->
                  <button id="camera-toggle-btn" class="w-20 h-20 rounded-full bg-primary flex items-center justify-center border-4 border-surface-tint shadow-[0_6px_0_#610000,0_10px_8px_rgba(0,0,0,0.4)] transition-transform duration-100 active:translate-y-2 active:shadow-[0_2px_0_#610000,0_4px_5px_rgba(0,0,0,0.4)] relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-full pointer-events-none"></div>
                    <span class="font-headline-lg text-[14px] text-on-primary uppercase tracking-tighter drop-shadow-md">SCAN</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Texto de estado del reconocimiento (progreso, errores, confirmaciones) -->
            <p id="recognition-state" class="shrink-0 font-label-lcd text-label-lcd text-on-surface-variant text-center">Esperando inicio de cámara...</p>

            <!-- Tarjeta de resultado: oculta hasta que se reconoce un Pokémon con éxito -->
            <div id="scan-result" class="hidden flex-1 min-h-0 bg-surface-container-low rounded-xl border-4 border-on-primary-fixed shadow-lg flex flex-col relative overflow-hidden">
              <div class="shrink-0 w-full h-8 bg-tertiary-container flex items-center px-4 border-b-2 border-on-primary-fixed">
                <span class="font-label-lcd text-label-lcd text-on-tertiary-container tracking-widest animate-pulse">¡RECONOCIDO!</span>
              </div>
              <!-- Aquí main.js inserta la tarjeta del Pokémon detectado (creada con createPokemonCard) -->
              <div id="result-card-content" class="flex-1 min-h-0 overflow-y-auto flex flex-col items-center gap-3 p-3"></div>
            </div>
          </div>

        </div>
      </div>
    </main>

  </div>
</div>

<!-- Librerías externas de reconocimiento visual: TensorFlow.js + Teachable Machine (image) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<!-- Punto de entrada de la app: type="module" permite usar import/export en main.js -->
<script type="module" src="js/main.js"></script>
</body>
</html>
